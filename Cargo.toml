[workspace]
resolver = "2"
members = [
    "crates/roedit-core",
    "crates/roedit-mesh",
    "crates/roedit-image",
    "crates/roedit-anim",
    "crates/roedit-io",
    "crates/roedit-render",
    "crates/roedit-video",
    "crates/roedit-plugins",
    "crates/roedit-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["RoEdit contributors"]
repository = "https://github.com/itriedcoding/RoEdit"

[workspace.lints.clippy]
# Style lints that clash with dense numeric code and test fixtures. Correctness
# lints stay enabled and CI runs clippy with `-D warnings`.
needless_range_loop = "allow"
field_reassign_with_default = "allow"

[workspace.dependencies]
roedit-core = { path = "crates/roedit-core" }
roedit-mesh = { path = "crates/roedit-mesh" }
roedit-image = { path = "crates/roedit-image" }
roedit-io = { path = "crates/roedit-io" }
roedit-render = { path = "crates/roedit-render" }
roedit-video = { path = "crates/roedit-video" }
roedit-plugins = { path = "crates/roedit-plugins" }

glam = { version = "0.30", features = ["serde", "bytemuck"] }
wgpu = "22.1"
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "wayland"] }
rfd = "0.15"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
rayon = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
exr = "1.74"
fontdue = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
