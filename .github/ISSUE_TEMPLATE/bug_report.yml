name: Bug report
description: Something does not work as documented
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail to reproduce the
        problem. If you are not running a released build, state the commit.
  - type: input
    id: version
    attributes:
      label: RoEdit version
      description: Release tag or commit hash, plus whether it is a release zip or a local build.
      placeholder: "0.1.0 (release zip)"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows version and GPU
      placeholder: "Windows 11 23H2, RTX 3060, driver 560.94"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Sculpt workspace
        2. Add a sphere
        3. Drag with the Flatten brush
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the exact error text or a description of the wrong result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Console output or the in-app Log dock. Run with RUST_LOG=debug for more detail.
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Modelling
        - Sculpting
        - UV editing
        - Texture painting
        - GFX
        - Rigging
        - Animation
        - Rendering
        - Video
        - Assets / import / export
        - Extensions
        - UI / shortcuts / settings
        - Build / packaging
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This report contains no fabricated steps or results.
          required: true
