name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Debug info roughly doubles MSVC compile and link time and CI needs none of it.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  # Lint and tests run on Linux, where the same suite takes a fraction of the
  # time a cold MSVC build needs. The Windows-only code paths are still
  # type-checked below with a Windows target and fully built in `build`.
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy for the Windows target
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets

  build:
    name: Build release executable
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/roedit.exe dist/
          Copy-Item README.md, LICENSE, CHANGELOG.md dist/
          Compress-Archive -Path dist/* -DestinationPath roedit-windows-x64.zip -Force
          Get-FileHash roedit-windows-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  roedit-windows-x64.zip" } |
            Out-File -Encoding ascii roedit-windows-x64.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: roedit-windows-x64
          path: |
            roedit-windows-x64.zip
            roedit-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    # Tag pushes publish that tag. Pushes to main publish (or refresh) the
    # release for the version in Cargo.toml so the executable is always
    # downloadable from Releases without a manual step.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout version metadata
        uses: actions/checkout@v4
        with:
          sparse-checkout: Cargo.toml

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tag}"

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: roedit-windows-x64

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: RoEdit Studio ${{ steps.tag.outputs.tag }}
          files: |
            roedit-windows-x64.zip
            roedit-windows-x64.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
